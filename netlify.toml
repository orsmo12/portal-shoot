# Netlify: deploy the web/ folder as-is (no build step).
[build]
  publish = "web"
  command = ""

# Service worker and manifest must never be cached, so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
