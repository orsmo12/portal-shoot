<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1a2160"/><stop offset=".6" stop-color="#0b1230"/><stop offset="1" stop-color="#04050f"/></radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f0ff9a" stop-opacity=".75"/><stop offset="1" stop-color="#c8ff64" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="62%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f6ffb0"/><stop offset="1" stop-color="#9fe84f"/></radialGradient>
    <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%"><stop offset=".35" stop-color="#9a5cff" stop-opacity=".7"/><stop offset="1" stop-color="#9a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#eef3ff"/><stop offset="1" stop-color="#a8c7ff"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.74) translate(-262 -262)">
  <g fill="#fff" opacity=".55"><circle cx="96" cy="120" r="2.2"/><circle cx="420" cy="96" r="1.8"/><circle cx="380" cy="400" r="2"/><circle cx="140" cy="300" r="1.5"/><circle cx="250" cy="80" r="1.6"/><circle cx="440" cy="250" r="1.4"/></g>
  <!-- black hole (lower left) -->
  <circle cx="176" cy="318" r="74" fill="url(#holeGlow)"/>
  <circle cx="176" cy="318" r="46" fill="none" stroke="#c9b6ff" stroke-width="5" stroke-dasharray="120 170" transform="rotate(-30 176 318)"/>
  <circle cx="176" cy="318" r="56" fill="none" stroke="#ffb3c8" stroke-width="3" stroke-opacity=".7" stroke-dasharray="90 260" transform="rotate(120 176 318)"/>
  <circle cx="176" cy="318" r="34" fill="#030109" stroke="#e6dcff" stroke-width="3"/>
  <!-- sun portal (upper right) -->
  <circle cx="320" cy="200" r="130" fill="url(#sunGlow)"/>
  <circle cx="320" cy="200" r="98" fill="none" stroke="#dcff78" stroke-opacity=".45" stroke-width="4"/>
  <circle cx="320" cy="200" r="118" fill="none" stroke="#dcff78" stroke-opacity=".22" stroke-width="3"/>
  <g fill="#ecff8c" fill-opacity=".75" transform="translate(320 200)">
    <path d="M0-92L7-74L-7-74Z"/><path d="M0-92L7-74L-7-74Z" transform="rotate(30)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(60)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(90)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(120)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(150)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(180)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(210)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(240)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(270)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(300)"/><path d="M0-92L7-74L-7-74Z" transform="rotate(330)"/>
  </g>
  <circle cx="320" cy="200" r="66" fill="url(#sun)"/>
  <!-- ball arc: from bottom, around the black hole, into the sun -->
  <path d="M120 430 Q 300 430 240 300 Q 200 230 286 216" fill="none" stroke="#cfe0ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16" opacity=".85"/>
  <circle cx="120" cy="430" r="22" fill="#cfe0ff" opacity=".35" filter="url(#soft)"/>
  <circle cx="120" cy="430" r="15" fill="url(#ball)"/>
  </g>
</svg>
